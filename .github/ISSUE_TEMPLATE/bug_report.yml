name: Bug report
description: Report a reproducible problem using non-sensitive data
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the version, OS, exact command, and a small synthetic input. No private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
